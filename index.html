<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kothon</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#dfe5e8;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    background:#efeae2;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:65px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:8px 12px;
}

.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    margin-right:10px;
}

.headerInfo{
    flex:1;
}

.headerInfo h2{
    margin:0;
    font-size:18px;
}

.headerInfo p{
    margin:3px 0 0;
    font-size:11px;
}

.logout{
    border:0;
    background:transparent;
    color:white;
    font-size:13px;
}

/* SEARCH */

.search{
    background:#f0f0f0;
    padding:8px;
    display:flex;
    gap:6px;
}

#searchInput{
    flex:1;
    border:0;
    outline:0;
    border-radius:22px;
    padding:11px 14px;
    font-size:14px;
}

#searchBtn{
    border:0;
    border-radius:20px;
    background:#128c7e;
    color:white;
    padding:0 15px;
}

/* RECENT */

#recentTitle{
    padding:10px 12px;
    font-weight:bold;
    color:#075e54;
    background:#f5f5f5;
}

#recentChats{
    background:white;
    max-height:250px;
    overflow-y:auto;
}

.recentItem{
    display:flex;
    align-items:center;
    padding:10px 12px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.recentItem:hover{
    background:#f5f5f5;
}

.recentItem img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
}

.recentInfo{
    flex:1;
    min-width:0;
}

.recentName{
    font-weight:bold;
    font-size:15px;
}

.recentLast{
    color:#777;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.recentTime{
    color:#777;
    font-size:10px;
}

/* SEARCH USERS */

#userList{
    max-height:180px;
    overflow-y:auto;
    background:white;
}

.userItem{
    display:flex;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #eee;
}

.userItem img{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
}

.userInfo{
    flex:1;
}

.userName{
    font-weight:bold;
    font-size:15px;
}

.userEmail{
    color:#777;
    font-size:10px;
}

.chatBtn{
    border:0;
    border-radius:18px;
    background:#128c7e;
    color:white;
    padding:7px 12px;
}

/* CHAT HEADER */

.chatHeader{
    display:none;
    align-items:center;
    background:#128c7e;
    color:white;
    padding:7px 10px;
}

.chatHeader img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    margin-right:9px;
}

.chatInfo{
    flex:1;
}

.chatName{
    font-weight:bold;
    font-size:15px;
}

.privateText{
    font-size:10px;
}

/* WELCOME */

#welcome{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
    padding:25px;
}

#welcome h2{
    color:#075e54;
}

/* CHAT */

#chat{
    display:none;
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.message{
    max-width:78%;
    padding:8px 11px;
    margin-bottom:8px;
    border-radius:9px;
    word-wrap:break-word;
    font-size:15px;
}

.myMessage{
    background:#d9fdd3;
    margin-left:auto;
}

.otherMessage{
    background:white;
    margin-right:auto;
}

.messageName{
    color:#075e54;
    font-size:11px;
    font-weight:bold;
    margin-bottom:3px;
}

.messageTime{
    color:#777;
    font-size:9px;
    text-align:right;
    margin-top:4px;
}

/* MESSAGE BOX */

#bottom{
    display:none;
    padding:8px;
    background:#f0f0f0;
    gap:6px;
}

#message{
    flex:1;
    border:0;
    outline:0;
    border-radius:25px;
    padding:12px 15px;
    font-size:15px;
}

#send{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#128c7e;
    color:white;
    font-size:20px;
}

/* LOGIN */

#loginScreen{
    position:fixed;
    inset:0;
    background:#075e54;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.loginBox{
    width:90%;
    max-width:370px;
    background:white;
    border-radius:18px;
    padding:24px;
}

.loginBox h1{
    text-align:center;
    color:#075e54;
    margin-top:0;
}

.loginBox input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.loginBox button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#128c7e;
    color:white;
    font-size:15px;
}

.registerButton{
    background:#34a853 !important;
}

#registerFields{
    display:none;
}

#authMessage{
    text-align:center;
    color:#d00;
    font-size:12px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<img
id="profileImage"
class="profile"
src="https://via.placeholder.com/100">

<div class="headerInfo">

<h2>💬 Kothon</h2>

<p id="userStatus">
Login করুন
</p>

</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>


<!-- SEARCH -->

<div class="search">

<input
id="searchInput"
type="text"
placeholder="নাম দিয়ে User খুঁজুন">

<button id="searchBtn">
🔍
</button>

</div>


<!-- RECENT TITLE -->

<div id="recentTitle">
💬 Recent Chat
</div>


<!-- RECENT CHAT -->

<div id="recentChats"></div>


<!-- SEARCH RESULT -->

<div id="userList"></div>


<!-- CHAT HEADER -->

<div
id="chatHeader"
class="chatHeader">

<img
id="chatImage"
src="https://via.placeholder.com/100">

<div class="chatInfo">

<div
id="chatName"
class="chatName">
</div>

<div class="privateText">
🔒 Private Chat
</div>

</div>

</div>


<!-- WELCOME -->

<div id="welcome">

<div>

<h2>
💬 Kothon
</h2>

<p>
উপরে User-এর নাম লিখে Search করুন।
</p>

<p>
যার সাথে Chat করবেন সে পরে Recent Chat-এ থাকবে।
</p>

</div>

</div>


<!-- CHAT -->

<div id="chat"></div>


<!-- MESSAGE -->

<div id="bottom">

<input
id="message"
type="text"
placeholder="মেসেজ লিখুন...">

<button id="send">
➤
</button>

</div>

</div>


<!-- LOGIN -->

<div id="loginScreen">

<div class="loginBox">

<h1>
💬 Kothon
</h1>


<div id="registerFields">

<input
id="name"
type="text"
placeholder="আপনার নাম">


<input
id="photo"
type="url"
placeholder="Profile ছবির URL (ঐচ্ছিক)">

</div>


<input
id="email"
type="email"
placeholder="Email">


<input
id="password"
type="password"
placeholder="Password">


<button
id="loginButton"
onclick="login()">

Login

</button>


<button
id="registerButton"
class="registerButton"
onclick="showRegister()">

নতুন Account তৈরি করুন

</button>


<div id="authMessage"></div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {

apiKey:
"AIzaSyD_HUTzo6I-X4rpDnoKArfPofSSHNkYeOM",

authDomain:
"you-chat-3896c.firebaseapp.com",

projectId:
"you-chat-3896c",

storageBucket:
"you-chat-3896c.firebasestorage.app",

messagingSenderId:
"874787277335",

appId:
"1:874787277335:web:f2a71f309a2f32ff60ea52",

measurementId:
"G-5S6HK3X836",

databaseURL:
"https://you-chat-3896c-default-rtdb.firebaseio.com/"

};


firebase.initializeApp(firebaseConfig);


const auth =
firebase.auth();

const database =
firebase.database();


let currentUser = null;

let myProfile = null;

let selectedUser = null;

let currentChatId = null;

let messageListener = null;


/* ==============================
   REGISTER SCREEN
============================== */

function showRegister(){

document
.getElementById("registerFields")
.style.display="block";


document
.getElementById("loginButton")
.innerText="Login";


document
.getElementById("registerButton")
.innerText="Account তৈরি করুন";


document
.getElementById("registerButton")
.onclick=register;

}


/* ==============================
   REGISTER
============================== */

function register(){

const name =
document.getElementById("name")
.value.trim();

const photo =
document.getElementById("photo")
.value.trim();

const email =
document.getElementById("email")
.value.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value;


if(name===""){

showError("আপনার নাম লিখুন");

return;

}


if(email===""){

showError("Email লিখুন");

return;

}


if(password.length<6){

showError(
"Password কমপক্ষে ৬ অক্ষরের হতে হবে"
);

return;

}


auth
.createUserWithEmailAndPassword(
email,
password
)

.then(function(result){

currentUser=result.user;


return database
.ref("users/"+currentUser.uid)
.set({

uid:currentUser.uid,

name:name,

email:email,

photo:photo,

createdAt:
firebase.database.ServerValue.TIMESTAMP

});

})

.then(function(){

loadMyProfile();

})

.catch(function(error){

showError(
firebaseError(error)
);

});

}


/* ==============================
   LOGIN
============================== */

function login(){

const email =
document.getElementById("email")
.value.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value;


if(email===""){

showError("Email লিখুন");

return;

}


if(password===""){

showError("Password লিখুন");

return;

}


auth
.signInWithEmailAndPassword(
email,
password
)

.catch(function(error){

showError(
firebaseError(error)
);

});

}


/* ==============================
   AUTH
============================== */

auth.onAuthStateChanged(
function(user){

if(user){

currentUser=user;

document
.getElementById("loginScreen")
.style.display="none";

loadMyProfile();

}else{

currentUser=null;

document
.getElementById("loginScreen")
.style.display="flex";

}

});


/* ==============================
   MY PROFILE
============================== */

function loadMyProfile(){

database
.ref("users/"+currentUser.uid)
.once("value")

.then(function(snapshot){

myProfile=snapshot.val();


if(!myProfile){

showError(
"Profile পাওয়া যায়নি"
);

return;

}


document
.getElementById("userStatus")
.innerText=
"🟢 "+myProfile.name;


if(myProfile.photo){

document
.getElementById("profileImage")
.src=
myProfile.photo;

}


loadRecentChats();

});

}


/* ==============================
   SEARCH
============================== */

document
.getElementById("searchBtn")
.addEventListener(
"click",
searchUsers
);


document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

searchUsers();

}

});


function searchUsers(){

const text =
document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();


const list =
document.getElementById("userList");


list.innerHTML="";


if(text===""){

return;

}


database
.ref("users")
.once("value")

.then(function(snapshot){

snapshot.forEach(
function(child){

const user=child.val();


if(
!currentUser ||
user.uid===currentUser.uid
){

return;

}


const name=
(user.name||"")
.toLowerCase();


if(name.includes(text)){

createUserItem(user);

}

});

})

.catch(function(error){

alert(
"User খুঁজতে সমস্যা হয়েছে:\n"+
error.message
);

});

}


/* ==============================
   USER ITEM
============================== */

function createUserItem(user){

const list =
document.getElementById(
"userList"
);


const item =
document.createElement("div");


item.className="userItem";


const image =
document.createElement("img");


image.src =
user.photo ||
"https://via.placeholder.com/100";


const info =
document.createElement("div");


info.className="userInfo";


const name =
document.createElement("div");


name.className="userName";


name.innerText =
user.name||"User";


const email =
document.createElement("div");


email.className="userEmail";


email.innerText =
user.email||"";


info.appendChild(name);

info.appendChild(email);


const button =
document.createElement("button");


button.className="chatBtn";

button.innerText="Chat";


button.onclick=function(){

openChat(user);

};


item.appendChild(image);

item.appendChild(info);

item.appendChild(button);

list.appendChild(item);

}


/* ==============================
   CHAT ID
============================== */

function makeChatId(uid1,uid2){

return [
uid1,
uid2
]
.sort()
.join("_");

}


/* ==============================
   OPEN CHAT
============================== */

function openChat(user){

selectedUser=user;

currentChatId=
makeChatId(
currentUser.uid,
user.uid
);


document
.getElementById("welcome")
.style.display="none";


document
.getElementById("chat")
.style.display="block";


document
.getElementById("bottom")
.style.display="flex";


document
.getElementById("chatHeader")
.style.display="flex";


document
.getElementById("chatName")
.innerText=user.name;


document
.getElementById("chatImage")
.src=
user.photo ||
"https://via.placeholder.com/100";


document
.getElementById("userList")
.innerHTML="";


document
.getElementById("searchInput")
.value="";


prepareChat();

}


/* ==============================
   PREPARE CHAT
============================== */

function prepareChat(){

const ref =
database.ref(
"chats/"+currentChatId
);


const members={};

members[currentUser.uid]=true;

members[selectedUser.uid]=true;


ref.update({

members:members

})

.then(function(){

loadMessages();

})

.catch(function(error){

alert(
"Chat তৈরি করা যায়নি:\n"+
error.message
);

console.log(error);

});

}


/* ==============================
   LOAD MESSAGES
============================== */

function loadMessages(){

const chat =
document.getElementById("chat");


chat.innerHTML="";


const ref =
database.ref(
"chats/"+
currentChatId+
"/messages"
);


if(messageListener){

ref.off(
"child_added",
messageListener
);

}


messageListener =
function(snapshot){

showMessage(
snapshot.val()
);

};


ref.on(
"child_added",
messageListener,
function(error){

alert(
"Message পড়া যাচ্ছে না:\n"+
error.message
);

});

}


/* ==============================
   SEND MESSAGE
============================== */

document
.getElementById("send")
.addEventListener(
"click",
sendMessage
);


document
.getElementById("message")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

sendMessage();

}

});


function sendMessage(){

const input =
document.getElementById("message");


const text =
input.value.trim();


if(text===""){

return;

}


if(!currentUser){

alert("আগে Login করুন");

return;

}


if(!currentChatId){

alert(
"আগে একজন User-এর Chat খুলুন"
);

return;

}


if(!myProfile){

alert(
"Profile এখনও লোড হচ্ছে"
);

return;

}


const messageRef =
database
.ref(
"chats/"+
currentChatId+
"/messages"
)
.push();


const now =
firebase.database.ServerValue.TIMESTAMP;


const message={

uid:
currentUser.uid,

name:
myProfile.name,

text:
text,

time:
new Date()
.toLocaleTimeString(
"bn-BD",
{
hour:"2-digit",
minute:"2-digit"
}
),

createdAt:now

};


messageRef
.set(message)

.then(function(){

/* নিজের Recent Chat */

return database
.ref(
"recentChats/"+
currentUser.uid+
"/"+
selectedUser.uid
)
.set({

uid:selectedUser.uid,

name:selectedUser.name,

photo:selectedUser.photo||"",

lastMessage:text,

lastTime:message.time,

updatedAt:
firebase.database.ServerValue.TIMESTAMP

});

})

.then(function(){

/* অন্য User-এর Recent Chat */

return database
.ref(
"recentChats/"+
selectedUser.uid+
"/"+
currentUser.uid
)
.set({

uid:currentUser.uid,

name:myProfile.name,

photo:myProfile.photo||"",

lastMessage:text,

lastTime:message.time,

updatedAt:
firebase.database.ServerValue.TIMESTAMP

});

})

.then(function(){

input.value="";

})

.catch(function(error){

alert(
"Message পাঠানো যায়নি:\n"+
error.message
);

});

}


/* ==============================
   SHOW MESSAGE
============================== */

function showMessage(data){

const chat =
document.getElementById("chat");


const box =
document.createElement("div");


if(
currentUser &&
data.uid===
currentUser.uid
){

box.className=
"message myMessage";

}else{

box.className=
"message otherMessage";

}


const name =
document.createElement("div");


name.className=
"messageName";


name.innerText=
data.name||"User";


const text =
document.createElement("div");


text.innerText=
data.text||"";


const time =
document.createElement("div");


time.className=
"messageTime";


time.innerText=
data.time||"";


box.appendChild(name);

box.appendChild(text);

box.appendChild(time);


chat.appendChild(box);


chat.scrollTop=
chat.scrollHeight;

}


/* ==============================
   RECENT CHATS
============================== */

function loadRecentChats(){

const recent =
document.getElementById(
"recentChats"
);


recent.innerHTML="";


database
.ref(
"recentChats/"+
currentUser.uid
)
.orderByChild("updatedAt")
.on(
"value",
function(snapshot){

recent.innerHTML="";


const chats=[];


snapshot.forEach(
function(child){

chats.push(
child.val()
);

});


chats.sort(
function(a,b){

return (
(b.updatedAt||0)-
(a.updatedAt||0)
);

});


chats.forEach(
function(user){

createRecentItem(user);

});

});

}


/* ==============================
   RECENT ITEM
============================== */

function createRecentItem(user){

const recent =
document.getElementById(
"recentChats"
);


const item =
document.createElement("div");


item.className=
"recentItem";


item.onclick=function(){

openChat(user);

};


const image =
document.createElement("img");


image.src=
user.photo||
"https://via.placeholder.com/100";


const info =
document.createElement("div");


info.className=
"recentInfo";


const name =
document.createElement("div");


name.className=
"recentName";


name.innerText=
user.name||"User";


const last =
document.createElement("div");


last.className=
"recentLast";


last.innerText=
user.lastMessage||
"No message";


info.appendChild(name);

info.appendChild(last);


const time =
document.createElement("div");


time.className=
"recentTime";


time.innerText=
user.lastTime||"";


item.appendChild(image);

item.appendChild(info);

item.appendChild(time);


recent.appendChild(item);

}


/* ==============================
   LOGOUT
============================== */

function logout(){

auth.signOut();

}


/* ==============================
   ERROR
============================== */

function showError(text){

document
.getElementById("authMessage")
.innerText=text;

}


/* ==============================
   FIREBASE ERROR
============================== */

function firebaseError(error){

if(
error.code===
"auth/email-already-in-use"
){

return "এই Email দিয়ে Account আগে থেকেই আছে।";

}


if(
error.code===
"auth/invalid-email"
){

return "Email ঠিক নয়।";

}


if(
error.code===
"auth/weak-password"
){

return "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

}


if(
error.code===
"auth/invalid-credential"
){

return "Email অথবা Password ভুল।";

}


if(
error.code===
"auth/user-not-found"
){

return "এই Email-এর কোনো Account নেই।";

}


return error.message;

}

</script>

</body>

</html>
