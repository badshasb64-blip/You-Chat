<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>You Chat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#dfe5e8;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    background:#efeae2;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:68px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:8px 12px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    margin-right:10px;
}

.headerInfo{
    flex:1;
}

.headerInfo h2{
    margin:0;
    font-size:19px;
}

.headerInfo p{
    margin:3px 0 0;
    font-size:12px;
}

.logout{
    border:none;
    background:transparent;
    color:white;
    font-size:14px;
}


/* ================= CHAT ================= */

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px 10px;
}

.message{
    max-width:78%;
    padding:8px 11px;
    margin-bottom:8px;
    border-radius:9px;
    word-wrap:break-word;
    font-size:15px;
}

.myMessage{
    background:#d9fdd3;
    margin-left:auto;
}

.otherMessage{
    background:white;
    margin-right:auto;
}

.email{
    color:#075e54;
    font-size:11px;
    font-weight:bold;
    margin-bottom:3px;
}

.time{
    color:#777;
    font-size:10px;
    text-align:right;
    margin-top:4px;
}


/* ================= INPUT ================= */

.bottom{
    background:#f0f0f0;
    padding:8px;
    display:flex;
    gap:7px;
}

#message{
    flex:1;
    border:none;
    outline:none;
    border-radius:25px;
    padding:12px 15px;
    font-size:15px;
}

#send{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#128c7e;
    color:white;
    font-size:20px;
}


/* ================= LOGIN ================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:#075e54;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.loginBox{
    width:90%;
    max-width:370px;
    background:white;
    border-radius:18px;
    padding:25px;
}

.loginBox h1{
    text-align:center;
    color:#075e54;
    margin-top:0;
}

.loginBox input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.loginBox button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#128c7e;
    color:white;
    font-size:16px;
}

#registerBtn{
    background:#34a853;
}

#messageBox{
    margin-top:12px;
    text-align:center;
    font-size:13px;
    color:#d00;
}

.switch{
    text-align:center;
    margin-top:15px;
    font-size:13px;
}

</style>

</head>

<body>


<!-- ================= CHAT APP ================= -->

<div class="app">

    <div class="header">

        <div class="logo">
            💬
        </div>

        <div class="headerInfo">

            <h2>
                You Chat
            </h2>

            <p id="userStatus">
                Login করুন
            </p>

        </div>

        <button
        class="logout"
        onclick="logout()">

            Logout

        </button>

    </div>


    <div id="chat">

    </div>


    <div class="bottom">

        <input
        id="message"
        type="text"
        placeholder="মেসেজ লিখুন..."
        >

        <button
        id="send">

            ➤

        </button>

    </div>

</div>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>
            💬 You Chat
        </h1>

        <p>
            Email দিয়ে Login করুন
        </p>


        <input
        id="email"
        type="email"
        placeholder="Email"
        >


        <input
        id="password"
        type="password"
        placeholder="Password"
        >


        <button
        onclick="login()">

            Login

        </button>


        <button
        id="registerBtn"
        onclick="register()">

            নতুন Account তৈরি করুন

        </button>


        <div
        id="messageBox">
        </div>


        <div class="switch">

            You Chat © 2026

        </div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyD_HUTzo6I-X4rpDnoKArfPofSSHNkYeOM",

    authDomain:
    "you-chat-3896c.firebaseapp.com",

    projectId:
    "you-chat-3896c",

    storageBucket:
    "you-chat-3896c.firebasestorage.app",

    messagingSenderId:
    "874787277335",

    appId:
    "1:874787277335:web:f2a71f309a2f32ff60ea52",

    measurementId:
    "G-5S6HK3X836",

    databaseURL:
    "https://you-chat-3896c-default-rtdb.firebaseio.com/"

};


/* Firebase চালু */

firebase.initializeApp(firebaseConfig);


/* Firebase Auth */

const auth =
firebase.auth();


/* Firebase Database */

const database =
firebase.database();


/* ==================================================
   MESSAGE
================================================== */

function showError(text){

    document
    .getElementById("messageBox")
    .innerText = text;

}


/* ==================================================
   REGISTER
================================================== */

function register(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    if(email === ""){

        showError(
            "Email লিখুন"
        );

        return;

    }


    if(password.length < 6){

        showError(
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
        );

        return;

    }


    auth
    .createUserWithEmailAndPassword(
        email,
        password
    )

    .then(function(result){

        showError(
            "Account তৈরি হয়েছে ✅"
        );

    })

    .catch(function(error){

        showError(
            error.message
        );

    });

}


/* ==================================================
   LOGIN
================================================== */

function login(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    if(email === ""){

        showError(
            "Email লিখুন"
        );

        return;

    }


    if(password === ""){

        showError(
            "Password লিখুন"
        );

        return;

    }


    auth
    .signInWithEmailAndPassword(
        email,
        password
    )

    .then(function(result){

        showError("");

    })

    .catch(function(error){

        showError(
            error.message
        );

    });

}


/* ==================================================
   AUTH STATE
================================================== */

auth.onAuthStateChanged(
function(user){

    if(user){

        document
        .getElementById(
            "loginScreen"
        )
        .style.display =
        "none";


        document
        .getElementById(
            "userStatus"
        )
        .innerText =
        "🟢 " +
        user.email;


        loadMessages();

    }else{

        document
        .getElementById(
            "loginScreen"
        )
        .style.display =
        "flex";


        document
        .getElementById(
            "userStatus"
        )
        .innerText =
        "Login করুন";

    }

});


/* ==================================================
   LOGOUT
================================================== */

function logout(){

    auth.signOut();

}


/* ==================================================
   SEND MESSAGE
================================================== */

document
.getElementById("send")
.addEventListener(
    "click",
    sendMessage
);


document
.getElementById("message")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);


function sendMessage(){

    const input =
    document
    .getElementById(
        "message"
    );


    const text =
    input.value.trim();


    if(text === ""){

        return;

    }


    const user =
    auth.currentUser;


    if(!user){

        alert(
            "আগে Login করুন"
        );

        return;

    }


    database
    .ref("messages")
    .push({

        uid:
        user.uid,

        email:
        user.email,

        text:
        text,

        time:
        new Date()
        .toLocaleTimeString(
            "bn-BD",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ),

        createdAt:
        firebase.database.ServerValue.TIMESTAMP

    });


    input.value = "";

}


/* ==================================================
   LOAD MESSAGES
================================================== */

function loadMessages(){

    const chat =
    document.getElementById(
        "chat"
    );


    chat.innerHTML = "";


    database
    .ref("messages")
    .off();


    database
    .ref("messages")
    .on(
        "child_added",
        function(snapshot){

            const data =
            snapshot.val();


            showMessage(data);

        }
    );

}


/* ==================================================
   SHOW MESSAGE
================================================== */

function showMessage(data){

    const chat =
    document.getElementById(
        "chat"
    );


    const div =
    document.createElement(
        "div"
    );


    const user =
    auth.currentUser;


    if(
        user &&
        data.uid === user.uid
    ){

        div.className =
        "message myMessage";

    }else{

        div.className =
        "message otherMessage";

    }


    div.innerHTML =

    '<div class="email">' +

    escapeHTML(
        data.email || "User"
    ) +

    '</div>' +

    '<div>' +

    escapeHTML(
        data.text || ""
    ) +

    '</div>' +

    '<div class="time">' +

    escapeHTML(
        data.time || ""
    ) +

    '</div>';


    chat.appendChild(
        div
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(text){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    text;

    return div.innerHTML;

}

</script>

</body>

</html>
