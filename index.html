<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kothon</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#d9dbd5;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    background:#efeae2;
    position:relative;
    overflow:hidden;
}

/* ================= HEADER ================= */

.header{
    height:65px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:8px 10px;
}

.headerLogo{
    width:45px;
    height:45px;
    object-fit:contain;
    border-radius:12px;
    margin-right:8px;
}

.profile{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    margin-right:10px;
}

.headerInfo{
    flex:1;
    overflow:hidden;
}

.headerInfo h2{
    font-size:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.headerInfo p{
    font-size:12px;
    opacity:.9;
    margin-top:2px;
}

.logout{
    background:#ffffff22;
    color:white;
    border:1px solid #ffffff55;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
}

/* ================= SEARCH ================= */

.searchBox{
    display:flex;
    gap:6px;
    padding:8px;
    background:#f0f2f5;
}

.searchBox input{
    flex:1;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.searchBox button{
    background:#128c7e;
    color:white;
    border:0;
    border-radius:8px;
    padding:0 15px;
    cursor:pointer;
}

/* ================= TITLES ================= */

.sectionTitle{
    padding:8px 12px;
    font-size:14px;
    font-weight:bold;
    color:#555;
    background:#e9edef;
}

/* ================= USER LIST ================= */

.userList,
.recentList{
    max-height:210px;
    overflow-y:auto;
    background:white;
}

.userItem,
.recentItem{
    display:flex;
    align-items:center;
    padding:9px 12px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.userItem:hover,
.recentItem:hover{
    background:#f5f5f5;
}

.userItem img,
.recentItem img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
    background:#ddd;
}

.userInfo{
    flex:1;
}

.userName{
    font-size:15px;
    font-weight:bold;
}

.userEmail{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.chatButton{
    background:#128c7e;
    color:white;
    border:0;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
}

/* ================= CHAT HEADER ================= */

.chatHeader{
    height:60px;
    background:#075e54;
    color:white;
    display:none;
    align-items:center;
    padding:7px 10px;
}

.chatHeader img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    margin-right:10px;
}

.chatInfo{
    flex:1;
}

.chatName{
    font-size:16px;
    font-weight:bold;
}

.privateText{
    font-size:11px;
    opacity:.9;
    margin-top:3px;
}

/* ================= WELCOME ================= */

#welcome{
    height:calc(100vh - 65px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    color:#555;
}

#welcome h2{
    color:#075e54;
    margin-bottom:10px;
}

.welcomeLogo{
    width:100px;
    height:100px;
    object-fit:contain;
    border-radius:22px;
    display:block;
    margin:0 auto 15px;
}

/* ================= CHAT ================= */

#chatArea{
    display:none;
    height:calc(100vh - 125px);
    position:relative;
}

#messages{
    height:calc(100% - 60px);
    overflow-y:auto;
    padding:10px;
    background:#efeae2;
}

.messageRow{
    display:flex;
    margin:5px 0;
}

.messageRow.mine{
    justify-content:flex-end;
}

.messageRow.other{
    justify-content:flex-start;
}

.message{
    max-width:78%;
    padding:7px 9px;
    border-radius:8px;
    box-shadow:0 1px 1px #0002;
    word-wrap:break-word;
}

.mine .message{
    background:#d9ffc7;
}

.other .message{
    background:white;
}

.messageName{
    font-size:11px;
    font-weight:bold;
    color:#075e54;
    margin-bottom:3px;
}

.messageText{
    font-size:14px;
    white-space:pre-wrap;
}

.messageTime{
    font-size:9px;
    color:#777;
    text-align:right;
    margin-top:3px;
}

/* ================= MESSAGE BOX ================= */

.messageBox{
    height:60px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    position:absolute;
    bottom:0;
    left:0;
    right:0;
}

.messageBox input{
    flex:1;
    border:0;
    outline:none;
    border-radius:22px;
    padding:12px 15px;
    font-size:14px;
}

.sendButton{
    width:45px;
    height:45px;
    border-radius:50%;
    border:0;
    background:#128c7e;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* ================= LOGIN ================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:#075e54;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.loginBox{
    width:100%;
    max-width:380px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 30px #0004;
}

.kothonLogo{
    width:85px;
    height:85px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
    border-radius:18px;
}

.loginBox h1{
    text-align:center;
    color:#075e54;
    margin-bottom:18px;
}

.loginBox input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.loginBox button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#128c7e;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin-top:5px;
}

.registerButton{
    background:#34a853 !important;
}

#registerFields{
    display:none;
}

#authMessage{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    color:#d00;
    min-height:18px;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .app{
        height:100vh;
    }

    .message{
        max-width:82%;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <img
            src="logo.png"
            class="headerLogo"
            alt="Kothon Logo"
        >

        <img
            id="profileImage"
            class="profile"
            src="https://via.placeholder.com/100"
            alt="Profile"
        >

        <div class="headerInfo">

            <h2>Kothon</h2>

            <p id="userStatus">
                Login করুন
            </p>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- ================= SEARCH ================= -->

    <div class="searchBox">

        <input
            id="searchInput"
            type="text"
            placeholder="User-এর নাম লিখুন..."
            onkeydown="if(event.key==='Enter') searchUsers()"
        >

        <button onclick="searchUsers()">
            Search
        </button>

    </div>


    <!-- ================= RECENT CHAT ================= -->

    <div class="sectionTitle">
        🕘 Recent Chats
    </div>

    <div
        id="recentChats"
        class="recentList"
    ></div>


    <!-- ================= SEARCH RESULT ================= -->

    <div class="sectionTitle">
        👥 Users
    </div>

    <div
        id="userList"
        class="userList"
    ></div>


    <!-- ================= WELCOME ================= -->

    <div id="welcome">

        <div>

            <img
                src="logo.png"
                class="welcomeLogo"
                alt="Kothon Logo"
            >

            <h2>Kothon</h2>

            <p>
                উপরে User-এর নাম লিখে Search করুন।
            </p>

            <p style="margin-top:8px;">
                যার সাথে Chat করবেন সে পরে Recent Chat-এ থাকবে।
            </p>

        </div>

    </div>


    <!-- ================= CHAT HEADER ================= -->

    <div
        id="chatHeader"
        class="chatHeader"
    >

        <img
            id="chatImage"
            src="https://via.placeholder.com/100"
            alt="User"
        >

        <div class="chatInfo">

            <div
                id="chatName"
                class="chatName"
            ></div>

            <div class="privateText">
                🔒 Private Chat
            </div>

        </div>

    </div>


    <!-- ================= CHAT AREA ================= -->

    <div id="chatArea">

        <div id="messages"></div>


        <!-- MESSAGE INPUT -->

        <div class="messageBox">

            <input
                id="messageInput"
                type="text"
                placeholder="মেসেজ লিখুন..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button
                class="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- ================= LOGIN SCREEN ================= -->

<div id="loginScreen">

    <div class="loginBox">

        <img
            src="logo.png"
            class="kothonLogo"
            alt="Kothon Logo"
        >

        <h1>Kothon</h1>


        <!-- REGISTER FIELDS -->

        <div id="registerFields">

            <input
                id="name"
                type="text"
                placeholder="আপনার নাম"
            >

            <input
                id="photo"
                type="text"
                placeholder="Profile Photo URL (Optional)"
            >

        </div>


        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <button
            id="loginButton"
            onclick="login()"
        >
            Login
        </button>


        <button
            id="registerButton"
            class="registerButton"
            onclick="showRegister()"
        >
            নতুন Account তৈরি করুন
        </button>


        <div id="authMessage"></div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyD_HUTzo6I-X4rpDnoKArfPofSSHNkYeOM",

    authDomain:
    "you-chat-3896c.firebaseapp.com",

    projectId:
    "you-chat-3896c",

    storageBucket:
    "you-chat-3896c.firebasestorage.app",

    messagingSenderId:
    "874787277335",

    appId:
    "1:874787277335:web:f2a71f309a2f32ff60ea52",

    measurementId:
    "G-5S6HK3X836",

    databaseURL:
    "https://you-chat-3896c-default-rtdb.firebaseio.com/"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let myProfile = null;

let selectedUser = null;

let currentChatId = null;

let messageListener = null;


/* =========================================================
   PLACEHOLDER
========================================================= */

const PLACEHOLDER =
    "https://via.placeholder.com/100";


/* =========================================================
   REGISTER SCREEN
========================================================= */

function showRegister(){

    document.getElementById(
        "registerFields"
    ).style.display = "block";

    document.getElementById(
        "loginButton"
    ).innerText = "Account তৈরি করুন";

    document.getElementById(
        "loginButton"
    ).onclick = register;

    document.getElementById(
        "registerButton"
    ).style.display = "none";

    document.getElementById(
        "authMessage"
    ).innerText = "";

}


/* =========================================================
   REGISTER
========================================================= */

async function register(){

    const name =
        document.getElementById("name").value.trim();

    const photo =
        document.getElementById("photo").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!name){

        showAuthMessage(
            "আপনার নাম লিখুন।"
        );

        return;
    }


    if(!email){

        showAuthMessage(
            "Email লিখুন।"
        );

        return;
    }


    if(password.length < 6){

        showAuthMessage(
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
        );

        return;
    }


    try{

        showAuthMessage(
            "Account তৈরি হচ্ছে..."
        );


        const result =
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );


        const user =
            result.user;


        const profile = {

            uid:user.uid,

            name:name,

            email:email,

            photo:photo || PLACEHOLDER,

            createdAt:
                firebase.database.ServerValue.TIMESTAMP

        };


        await database
            .ref("users/" + user.uid)
            .set(profile);


        showAuthMessage(
            "Account তৈরি হয়েছে।"
        );


    }catch(error){

        showAuthMessage(
            getFirebaseError(error)
        );

    }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!email){

        showAuthMessage(
            "Email লিখুন।"
        );

        return;
    }


    if(!password){

        showAuthMessage(
            "Password লিখুন।"
        );

        return;
    }


    try{

        showAuthMessage(
            "Login হচ্ছে..."
        );


        await auth.signInWithEmailAndPassword(
            email,
            password
        );


    }catch(error){

        showAuthMessage(
            getFirebaseError(error)
        );

    }

}


/* =========================================================
   FIREBASE ERROR
========================================================= */

function getFirebaseError(error){

    if(error.code === "auth/invalid-email")
        return "Email ঠিক নয়।";

    if(error.code === "auth/user-not-found")
        return "এই Email দিয়ে কোনো Account নেই।";

    if(error.code === "auth/wrong-password")
        return "Password ভুল।";

    if(error.code === "auth/email-already-in-use")
        return "এই Email দিয়ে Account আগে থেকেই আছে।";

    if(error.code === "auth/weak-password")
        return "Password আরও শক্তিশালী দিন।";

    return error.message || "একটি সমস্যা হয়েছে।";

}


/* =========================================================
   AUTH MESSAGE
========================================================= */

function showAuthMessage(message){

    document.getElementById(
        "authMessage"
    ).innerText = message;

}


/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(
    async function(user){

        if(user){

            currentUser = user;


            document.getElementById(
                "loginScreen"
            ).style.display = "none";


            await loadMyProfile();


            document.getElementById(
                "userStatus"
            ).innerText =
                myProfile.name;


            document.getElementById(
                "profileImage"
            ).src =
                myProfile.photo || PLACEHOLDER;


            loadRecentChats();


        }else{

            currentUser = null;

            myProfile = null;

            document.getElementById(
                "loginScreen"
            ).style.display = "flex";


            document.getElementById(
                "userStatus"
            ).innerText =
                "Login করুন";

        }

    }
);


/* =========================================================
   LOAD MY PROFILE
========================================================= */

async function loadMyProfile(){

    const snapshot =
        await database
        .ref("users/" + currentUser.uid)
        .once("value");


    if(snapshot.exists()){

        myProfile =
            snapshot.val();

    }else{

        myProfile = {

            uid:currentUser.uid,

            name:
                currentUser.email.split("@")[0],

            email:
                currentUser.email,

            photo:
                PLACEHOLDER

        };

    }

}


/* =========================================================
   SEARCH USERS
========================================================= */

async function searchUsers(){

    const text =
        document.getElementById(
            "searchInput"
        ).value.trim().toLowerCase();


    const userList =
        document.getElementById(
            "userList"
        );


    userList.innerHTML = "";


    if(!text){

        userList.innerHTML =
            "<div style='padding:15px;text-align:center;color:#777;'>User-এর নাম লিখুন।</div>";

        return;
    }


    try{

        const snapshot =
            await database
            .ref("users")
            .once("value");


        let found = false;


        snapshot.forEach(
            function(child){

                const data =
                    child.val();


                if(
                    data.uid !== currentUser.uid &&
                    String(data.name || "")
                        .toLowerCase()
                        .includes(text)
                ){

                    found = true;

                    createUserItem(
                        data,
                        userList
                    );

                }

            }
        );


        if(!found){

            userList.innerHTML =
                "<div style='padding:15px;text-align:center;color:#777;'>কোনো User পাওয়া যায়নি।</div>";

        }


    }catch(error){

        console.error(error);

        userList.innerHTML =
            "<div style='padding:15px;color:red;'>User Search করা যায়নি।</div>";

    }

}


/* =========================================================
   CREATE USER ITEM
========================================================= */

function createUserItem(
    data,
    container
){

    const item =
        document.createElement("div");

    item.className =
        "userItem";


    const image =
        document.createElement("img");

    image.src =
        data.photo || PLACEHOLDER;


    const info =
        document.createElement("div");

    info.className =
        "userInfo";


    const name =
        document.createElement("div");

    name.className =
        "userName";

    name.innerText =
        data.name || "User";


    const email =
        document.createElement("div");

    email.className =
        "userEmail";

    email.innerText =
        data.email || "";


    info.appendChild(name);

    info.appendChild(email);


    const button =
        document.createElement("button");

    button.className =
        "chatButton";

    button.innerText =
        "Chat";


    button.onclick =
        function(){

            openChat(data);

        };


    item.appendChild(image);

    item.appendChild(info);

    item.appendChild(button);


    container.appendChild(item);

}


/* =========================================================
   CHAT ID
========================================================= */

function getChatId(uid1, uid2){

    return [uid1, uid2]
        .sort()
        .join("_");

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(user){

    selectedUser =
        user;


    currentChatId =
        getChatId(
            currentUser.uid,
            user.uid
        );


    document.getElementById(
        "welcome"
    ).style.display = "none";


    document.getElementById(
        "chatHeader"
    ).style.display = "flex";


    document.getElementById(
        "chatArea"
    ).style.display = "block";


    document.getElementById(
        "chatName"
    ).innerText =
        user.name || "User";


    document.getElementById(
        "chatImage"
    ).src =
        user.photo || PLACEHOLDER;


    await prepareChat();


    loadMessages();


    document.getElementById(
        "messageInput"
    ).focus();

}


/* =========================================================
   PREPARE CHAT
========================================================= */

async function prepareChat(){

    const chatRef =
        database.ref(
            "chats/" + currentChatId
        );


    const snapshot =
        await chatRef.once("value");


    if(!snapshot.exists()){

        await chatRef.child(
            "members/" + currentUser.uid
        ).set(true);


        await chatRef.child(
            "members/" + selectedUser.uid
        ).set(true);

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

function loadMessages(){

    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML = "";


    if(messageListener){

        database
        .ref(
            "chats/" +
            currentChatId +
            "/messages"
        )
        .off(
            "child_added",
            messageListener
        );

    }


    messageListener =
        function(snapshot){

            const data =
                snapshot.val();


            showMessage(data);

        };


    database
    .ref(
        "chats/" +
        currentChatId +
        "/messages"
    )
    .on(
        "child_added",
        messageListener
    );

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(data){

    const messages =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement("div");


    const mine =
        data.senderId === currentUser.uid;


    row.className =
        "messageRow " +
        (mine ? "mine" : "other");


    const box =
        document.createElement("div");

    box.className =
        "message";


    const name =
        document.createElement("div");

    name.className =
        "messageName";


    name.innerText =
        data.name || "User";


    const text =
        document.createElement("div");

    text.className =
        "messageText";


    text.innerText =
        data.text || "";


    const time =
        document.createElement("div");

    time.className =
        "messageTime";


    time.innerText =
        formatTime(
            data.createdAt
        );


    box.appendChild(name);

    box.appendChild(text);

    box.appendChild(time);


    row.appendChild(box);


    messages.appendChild(row);


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(!currentUser){

        alert("আগে Login করুন।");

        return;
    }


    if(!selectedUser){

        alert("আগে একজন User-এর Chat খুলুন।");

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;
    }


    if(!currentChatId){

        alert("Chat প্রস্তুত হয়নি।");

        return;
    }


    const message = {

        senderId:
            currentUser.uid,

        receiverId:
            selectedUser.uid,

        name:
            myProfile.name || "User",

        text:
            text,

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    };


    try{

        /* MESSAGE SAVE */

        await database
        .ref(
            "chats/" +
            currentChatId +
            "/messages"
        )
        .push(message);


        /* RECENT CHAT - আমার তালিকায় */

        await database
        .ref(
            "recentChats/" +
            currentUser.uid +
            "/" +
            selectedUser.uid
        )
        .set({

            uid:
                selectedUser.uid,

            name:
                selectedUser.name || "User",

            photo:
                selectedUser.photo || PLACEHOLDER,

            updatedAt:
                firebase.database.ServerValue.TIMESTAMP

        });


        /* RECENT CHAT - অন্য User-এর তালিকায় */

        await database
        .ref(
            "recentChats/" +
            selectedUser.uid +
            "/" +
            currentUser.uid
        )
        .set({

            uid:
                currentUser.uid,

            name:
                myProfile.name || "User",

            photo:
                myProfile.photo || PLACEHOLDER,

            updatedAt:
                firebase.database.ServerValue.TIMESTAMP

        });


        input.value = "";


        loadRecentChats();


    }catch(error){

        console.error(
            "Message Error:",
            error
        );


        alert(
            "Message পাঠাতে সমস্যা হয়েছে। Firebase Rules পরীক্ষা করুন।"
        );

    }

}


/* =========================================================
   LOAD RECENT CHATS
========================================================= */

function loadRecentChats(){

    const container =
        document.getElementById(
            "recentChats"
        );


    container.innerHTML = "";


    if(!currentUser){

        return;
    }


    database
    .ref(
        "recentChats/" +
        currentUser.uid
    )
    .orderByChild("updatedAt")
    .limitToLast(30)
    .once("value")
    .then(
        function(snapshot){

            const list = [];


            snapshot.forEach(
                function(child){

                    list.push(
                        child.val()
                    );

                }
            );


            list.reverse();


            if(list.length === 0){

                container.innerHTML =
                    "<div style='padding:12px;text-align:center;color:#777;'>এখনো কোনো Recent Chat নেই।</div>";

                return;

            }


            list.forEach(
                function(data){

                    createRecentItem(
                        data,
                        container
                    );

                }
            );

        }
    )
    .catch(
        function(error){

            console.error(
                error
            );

        }
    );

}


/* =========================================================
   CREATE RECENT ITEM
========================================================= */

function createRecentItem(
    data,
    container
){

    const item =
        document.createElement("div");

    item.className =
        "recentItem";


    const image =
        document.createElement("img");

    image.src =
        data.photo || PLACEHOLDER;


    const info =
        document.createElement("div");

    info.className =
        "userInfo";


    const name =
        document.createElement("div");

    name.className =
        "userName";

    name.innerText =
        data.name || "User";


    const small =
        document.createElement("div");

    small.className =
        "userEmail";

    small.innerText =
        "💬 Chat";


    info.appendChild(name);

    info.appendChild(small);


    item.appendChild(image);

    item.appendChild(info);


    item.onclick =
        async function(){

            try{

                const snapshot =
                    await database
                    .ref(
                        "users/" +
                        data.uid
                    )
                    .once("value");


                if(snapshot.exists()){

                    openChat(
                        snapshot.val()
                    );

                }else{

                    openChat({
                        uid:data.uid,
                        name:data.name,
                        photo:data.photo
                    });

                }

            }catch(error){

                console.error(error);

            }

        };


    container.appendChild(item);

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(timestamp){

    if(!timestamp){

        return "";

    }


    const date =
        new Date(timestamp);


    return date.toLocaleTimeString(
        "bn-BD",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    if(messageListener && currentChatId){

        database
        .ref(
            "chats/" +
            currentChatId +
            "/messages"
        )
        .off(
            "child_added",
            messageListener
        );

    }


    await auth.signOut();


    document.getElementById(
        "chatArea"
    ).style.display = "none";


    document.getElementById(
        "chatHeader"
    ).style.display = "none";


    document.getElementById(
        "welcome"
    ).style.display = "flex";


    document.getElementById(
        "userList"
    ).innerHTML = "";


    document.getElementById(
        "recentChats"
    ).innerHTML = "";

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

document.getElementById(
    "welcome"
).style.display = "flex";


</script>
