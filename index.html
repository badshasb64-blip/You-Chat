<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kothon</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#d9dbd5;
}

.app{
  width:100%;
  max-width:520px;
  height:100vh;
  margin:auto;
  background:#efeae2;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:65px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:10px;
}

.profile{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.headerInfo{
  flex:1;
  min-width:0;
}

.headerInfo h2{
  margin:0;
  font-size:20px;
}

.headerInfo p{
  margin:3px 0 0;
  font-size:12px;
  opacity:.9;
}

.logout{
  border:none;
  background:#d32f2f;
  color:white;
  padding:8px 10px;
  border-radius:7px;
  cursor:pointer;
}

/* SEARCH */

.searchArea{
  padding:10px;
  background:#f0f2f5;
  display:flex;
  gap:6px;
}

.searchArea input{
  flex:1;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.searchArea button{
  border:none;
  background:#075e54;
  color:white;
  padding:0 15px;
  border-radius:8px;
}

/* TITLES */

.sectionTitle{
  padding:10px 12px;
  font-weight:bold;
  background:#e9edef;
  color:#075e54;
}

/* USERS */

.userList,
.friendList,
.recentList{
  overflow-y:auto;
}

.userItem,
.friendItem,
.recentItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:white;
  border-bottom:1px solid #eee;
}

.userItem img,
.friendItem img,
.recentItem img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.userInfo{
  flex:1;
}

.userName{
  font-weight:bold;
  color:#222;
}

.userEmail{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.actionButton{
  border:none;
  padding:8px 10px;
  border-radius:7px;
  color:white;
  cursor:pointer;
}

.addFriend{
  background:#128c7e;
}

.chatButton{
  background:#075e54;
}

.alreadyFriend{
  background:#777;
}

/* CHAT */

#chatArea{
  display:none;
  position:absolute;
  top:65px;
  left:0;
  right:0;
  bottom:0;
  background:#efeae2;
  z-index:10;
}

.chatHeader{
  height:60px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 10px;
}

.backButton{
  border:none;
  background:transparent;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.chatHeader img{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
}

.chatInfo{
  flex:1;
}

.chatName{
  font-size:18px;
  font-weight:bold;
}

.privateText{
  font-size:11px;
  opacity:.9;
}

.messages{
  position:absolute;
  top:60px;
  bottom:62px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:12px 8px;
}

.messageRow{
  display:flex;
  margin:5px 0;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageRow.other{
  justify-content:flex-start;
}

.messageBubble{
  max-width:78%;
  padding:8px 10px;
  border-radius:8px;
  word-wrap:break-word;
  white-space:pre-wrap;
  font-size:15px;
}

.mine .messageBubble{
  background:#d9fdd3;
  border-top-right-radius:2px;
}

.other .messageBubble{
  background:white;
  border-top-left-radius:2px;
}

.messageName{
  font-size:11px;
  font-weight:bold;
  color:#075e54;
  margin-bottom:3px;
}

.messageTime{
  font-size:9px;
  color:#777;
  text-align:right;
  margin-top:3px;
}

/* MESSAGE BOX */

.messageBox{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:62px;
  background:#f0f2f5;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
}

.messageBox input{
  flex:1;
  height:45px;
  border:none;
  border-radius:22px;
  padding:0 16px;
  font-size:15px;
  outline:none;
}

.sendButton{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#128c7e;
  color:white;
  font-size:19px;
  cursor:pointer;
}

/* WELCOME */

#welcome{
  padding:35px 20px;
  text-align:center;
  color:#555;
}

#welcome img{
  width:90px;
  height:90px;
  object-fit:contain;
  margin-bottom:10px;
}

#welcome h2{
  color:#075e54;
}

/* LOGIN */

#loginScreen{
  position:fixed;
  inset:0;
  background:#075e54;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.loginLogo{
  display:block;
  width:90px;
  height:90px;
  object-fit:contain;
  margin:0 auto 10px;
}

.loginBox h1{
  text-align:center;
  color:#075e54;
  margin:5px 0 20px;
}

.loginBox input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.loginBox button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#075e54;
  color:white;
  font-size:15px;
}

.registerButton{
  background:#128c7e !important;
}

#authMessage{
  text-align:center;
  color:#d32f2f;
  margin-top:10px;
  font-size:13px;
}

#registerFields{
  display:none;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

</style>
</head>

<body>

<div class="app">

  <!-- MAIN HEADER -->

  <div class="header">

    <img id="profileImage"
         class="profile"
         src="logo.png">

    <div class="headerInfo">
      <h2>💬 Kothon</h2>
      <p id="userStatus">Login করুন</p>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

  </div>


  <!-- SEARCH -->

  <div class="searchArea">

    <input
      id="searchInput"
      type="text"
      placeholder="নাম দিয়ে User Search করুন">

    <button onclick="searchUsers()">Search</button>

  </div>


  <!-- SEARCH RESULTS -->

  <div class="sectionTitle">
    🔍 Search Result
  </div>

  <div id="userList" class="userList"></div>


  <!-- FRIENDS -->

  <div class="sectionTitle">
    👥 My Friends
  </div>

  <div id="friendList" class="friendList"></div>


  <!-- RECENT -->

  <div class="sectionTitle">
    💬 Recent Chats
  </div>

  <div id="recentList" class="recentList"></div>


  <!-- WELCOME -->

  <div id="welcome">

    <img src="logo.png">

    <h2>💬 Kothon</h2>

    <p>
      প্রথমে User Search করুন।
    </p>

    <p>
      তারপর ➕ Add Friend চাপুন।
    </p>

    <p>
      Friend হয়ে গেলে 💬 Chat করে মেসেজ পাঠাতে পারবেন।
    </p>

  </div>


  <!-- CHAT AREA -->

  <div id="chatArea">

    <div class="chatHeader">

      <button class="backButton" onclick="closeChat()">
        ‹
      </button>

      <img
        id="chatImage"
        src="logo.png">

      <div class="chatInfo">

        <div id="chatName" class="chatName">
          User
        </div>

        <div class="privateText">
          🔒 Private Chat
        </div>

      </div>

    </div>


    <!-- MESSAGES -->

    <div id="messages" class="messages"></div>


    <!-- MESSAGE INPUT -->

    <div class="messageBox">

      <input
        id="messageInput"
        type="text"
        placeholder="মেসেজ লিখুন...">

      <button
        class="sendButton"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</div>


<!-- LOGIN SCREEN -->

<div id="loginScreen">

  <div class="loginBox">

    <img
      src="logo.png"
      class="loginLogo">

    <h1>💬 Kothon</h1>


    <!-- REGISTER FIELDS -->

    <div id="registerFields">

      <input
        id="registerName"
        type="text"
        placeholder="আপনার নাম">

      <input
        id="registerPhoto"
        type="text"
        placeholder="Profile Photo URL (Optional)">

    </div>


    <input
      id="email"
      type="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Password">


    <button
      id="loginButton"
      onclick="login()">
      Login
    </button>


    <button
      id="registerButton"
      class="registerButton"
      onclick="showRegister()">
      নতুন Account তৈরি করুন
    </button>


    <div id="authMessage"></div>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyD_HUTzo6I-X4rpDnoKArfPofSSHNkYeOM",

  authDomain: "you-chat-3896c.firebaseapp.com",

  databaseURL:
    "https://you-chat-3896c-default-rtdb.firebaseio.com/",

  projectId: "you-chat-3896c",

  storageBucket:
    "you-chat-3896c.firebasestorage.app",

  messagingSenderId: "874787277335",

  appId:
    "1:874787277335:web:f2a71f309a2f32ff60ea52",

  measurementId: "G-5S6HK3X836"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let myProfile = null;

let selectedUser = null;

let currentChatId = null;

let messageListener = null;


/* =========================
   LOGIN / REGISTER
========================= */

function showRegister(){

  document.getElementById("registerFields").style.display =
    "block";

  document.getElementById("loginButton").style.display =
    "none";

  document.getElementById("registerButton").innerText =
    "Account তৈরি করুন";

  document.getElementById("registerButton").onclick =
    register;

}


function register(){

  const name =
    document.getElementById("registerName").value.trim();

  const photo =
    document.getElementById("registerPhoto").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(!name){

    showAuthMessage("আপনার নাম লিখুন");

    return;
  }


  if(!email || !password){

    showAuthMessage("Email এবং Password দিন");

    return;
  }


  auth.createUserWithEmailAndPassword(
    email,
    password
  )

  .then(result => {

    const uid = result.user.uid;

    const profile = {

      uid:uid,

      name:name,

      email:email,

      photo:photo || "logo.png",

      createdAt:Date.now()

    };


    return database
      .ref("users/" + uid)
      .set(profile);

  })

  .then(() => {

    showAuthMessage("Account তৈরি হয়েছে");

  })

  .catch(error => {

    showAuthMessage(error.message);

  });

}


function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(!email || !password){

    showAuthMessage("Email এবং Password দিন");

    return;

  }


  auth.signInWithEmailAndPassword(
    email,
    password
  )

  .catch(error => {

    showAuthMessage(error.message);

  });

}


function showAuthMessage(text){

  document.getElementById("authMessage").innerText =
    text;

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(user => {

  if(user){

    currentUser = user;

    document.getElementById("loginScreen").style.display =
      "none";


    database
      .ref("users/" + user.uid)
      .once("value")

      .then(snapshot => {

        myProfile = snapshot.val();


        if(!myProfile){

          myProfile = {

            uid:user.uid,

            name:user.email.split("@")[0],

            email:user.email,

            photo:"logo.png",

            createdAt:Date.now()

          };

          return database
            .ref("users/" + user.uid)
            .set(myProfile);

        }

      })

      .then(() => {

        updateHeader();

        loadFriends();

        loadRecentChats();

      });

  }

  else{

    currentUser = null;

    myProfile = null;

    document.getElementById("loginScreen").style.display =
      "flex";

  }

});


/* =========================
   HEADER
========================= */

function updateHeader(){

  document.getElementById("userStatus").innerText =
    myProfile.name;


  document.getElementById("profileImage").src =
    myProfile.photo || "logo.png";

}


/* =========================
   SEARCH USERS
========================= */

function searchUsers(){

  const text =
    document.getElementById("searchInput").value
    .trim()
    .toLowerCase();


  const list =
    document.getElementById("userList");


  list.innerHTML = "";


  if(!text){

    list.innerHTML =
      '<div class="empty">নাম লিখে Search করুন</div>';

    return;

  }


  database
    .ref("users")
    .once("value")

    .then(snapshot => {

      let found = false;


      snapshot.forEach(child => {

        const user = child.val();


        if(
          user.uid !== currentUser.uid &&
          user.name &&
          user.name.toLowerCase().includes(text)
        ){

          found = true;

          showSearchUser(user);

        }

      });


      if(!found){

        list.innerHTML =
          '<div class="empty">কোনো User পাওয়া যায়নি</div>';

      }

    });

}


/* =========================
   SHOW SEARCH USER
========================= */

function showSearchUser(user){

  const list =
    document.getElementById("userList");


  const item =
    document.createElement("div");

  item.className = "userItem";


  const img =
    document.createElement("img");

  img.src =
    user.photo || "logo.png";


  const info =
    document.createElement("div");

  info.className = "userInfo";


  const name =
    document.createElement("div");

  name.className = "userName";

  name.innerText =
    user.name || "User";


  const email =
    document.createElement("div");

  email.className = "userEmail";

  email.innerText =
    user.email || "";


  info.appendChild(name);

  info.appendChild(email);


  const button =
    document.createElement("button");

  button.className =
    "actionButton addFriend";

  button.innerText =
    "➕ Friend";


  checkFriend(user.uid)
    .then(isFriend => {

      if(isFriend){

        button.innerText =
          "💬 Chat";

        button.className =
          "actionButton chatButton";

        button.onclick =
          () => openChat(user);

      }

      else{

        button.onclick =
          () => addFriend(user);

      }

    });


  item.appendChild(img);

  item.appendChild(info);

  item.appendChild(button);


  list.appendChild(item);

}


/* =========================
   CHECK FRIEND
========================= */

function checkFriend(uid){

  return database
    .ref(
      "friends/" +
      currentUser.uid +
      "/" +
      uid
    )
    .once("value")

    .then(snapshot => snapshot.exists());

}


/* =========================
   ADD FRIEND
========================= */

function addFriend(user){

  if(!currentUser){

    return;

  }


  const updates = {};


  updates[
    "friends/" +
    currentUser.uid +
    "/" +
    user.uid
  ] = {

    uid:user.uid,

    name:user.name,

    email:user.email,

    photo:user.photo || "logo.png",

    addedAt:Date.now()

  };


  updates[
    "friends/" +
    user.uid +
    "/" +
    currentUser.uid
  ] = {

    uid:currentUser.uid,

    name:myProfile.name,

    email:myProfile.email,

    photo:myProfile.photo || "logo.png",

    addedAt:Date.now()

  };


  database
    .ref()
    .update(updates)

    .then(() => {

      alert(
        user.name +
        " এখন আপনার Friend ✅"
      );


      loadFriends();

      searchUsers();

    })

    .catch(error => {

      alert(
        "Friend তৈরি করা যায়নি: " +
        error.message
      );

    });

}


/* =========================
   LOAD FRIENDS
========================= */

function loadFriends(){

  const list =
    document.getElementById("friendList");


  list.innerHTML = "";


  database
    .ref(
      "friends/" +
      currentUser.uid
    )
    .once("value")

    .then(snapshot => {

      if(!snapshot.exists()){

        list.innerHTML =
          '<div class="empty">এখনো কোনো Friend নেই</div>';

        return;

      }


      snapshot.forEach(child => {

        const friend =
          child.val();


        const item =
          document.createElement("div");

        item.className =
          "friendItem";


        const img =
          document.createElement("img");

        img.src =
          friend.photo || "logo.png";


        const info =
          document.createElement("div");

        info.className =
          "userInfo";


        const name =
          document.createElement("div");

        name.className =
          "userName";

        name.innerText =
          friend.name || "User";


        info.appendChild(name);


        const button =
          document.createElement("button");

        button.className =
          "actionButton chatButton";

        button.innerText =
          "💬 Chat";


        button.onclick =
          () => openChat(friend);


        item.appendChild(img);

        item.appendChild(info);

        item.appendChild(button);


        list.appendChild(item);

      });

    });

}


/* =========================
   CHAT ID
========================= */

function getChatId(uid1, uid2){
  return "v3_" + [uid1, uid2].sort().join("_");
  }

/* =========================
   OPEN CHAT
========================= */

function openChat(user){

  selectedUser = user;


  currentChatId =
    getChatId(
      currentUser.uid,
      user.uid
    );


  document.getElementById("chatArea").style.display =
    "block";


  document.getElementById("welcome").style.display =
    "none";


  document.getElementById("chatName").innerText =
    user.name || "User";


  document.getElementById("chatImage").src =
    user.photo || "logo.png";


  document.getElementById("messages").innerHTML = "";


  prepareChat();


  setTimeout(() => {

    document
      .getElementById("messageInput")
      .focus();

  },200);

}


/* =========================
   PREPARE CHAT
========================= */

function prepareChat(){

  const chatRef = database.ref(
    "chats/" + currentChatId
  );

  const members = {
    [currentUser.uid]: true,
    [selectedUser.uid]: true
  };

  chatRef.once("value")
    .then(snapshot => {

      if(!snapshot.exists()){

        return chatRef.set({
          members: members,
          createdAt: Date.now()
        });

      }

      const data = snapshot.val() || {};

      if(!data.members){

        return chatRef.update({
          members: members
        });

      }

    })
    .then(() => {

      loadMessages();

    })
    .catch(error => {

      console.error("Prepare Chat Error:", error);

      alert(
        "Chat তৈরি করা যায়নি: " +
        error.message
      );

    });

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

  const messagesRef =
    database
      .ref(
        "chats/" +
        currentChatId +
        "/messages"
      )
      .orderByChild("createdAt");


  if(messageListener){

    messageListener();

  }


  const callback =
    messagesRef.on(
      "value",
      snapshot => {

        const box =
          document.getElementById("messages");


        box.innerHTML = "";


        snapshot.forEach(child => {

          const data =
            child.val();


          showMessage(data,box);

        });


        box.scrollTop =
          box.scrollHeight;

      }
    );


  messageListener =
    () => {

      database
        .ref(
          "chats/" +
          currentChatId +
          "/messages"
        )
        .off("value",callback);

    };

}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(data,box){

  const row =
    document.createElement("div");


  const mine =
    data.senderId === currentUser.uid;


  row.className =
    "messageRow " +
    (mine ? "mine" : "other");


  const bubble =
    document.createElement("div");

  bubble.className =
    "messageBubble";


  const name =
    document.createElement("div");

  name.className =
    "messageName";

  name.innerText =
    data.name || "User";


  const text =
    document.createElement("div");

  text.innerText =
    data.text || "";


  const time =
    document.createElement("div");

  time.className =
    "messageTime";


  if(data.createdAt){

    time.innerText =
      new Date(
        data.createdAt
      ).toLocaleTimeString(
        "bn-BD",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }


  bubble.appendChild(name);

  bubble.appendChild(text);

  bubble.appendChild(time);

  row.appendChild(bubble);

  box.appendChild(row);

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage(){

  if(!currentUser){

    alert("আগে Login করুন");
    return;

  }

  if(!selectedUser){

    alert("আগে একজন Friend-এর Chat খুলুন");
    return;

  }

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  const messageRef =
    database
      .ref(
        "chats/" +
        currentChatId +
        "/messages"
      )
      .push();

  const message = {

    senderId: currentUser.uid,

    receiverId: selectedUser.uid,

    name: myProfile.name || "User",

    text: text,

    createdAt: Date.now()

  };

  messageRef.set(message)

    .then(() => {

      input.value = "";

      input.focus();

      updateRecentChat(selectedUser);

    })

    .catch(error => {

      console.error(
        "Send Message Error:",
        error
      );

      alert(
        "Message পাঠানো যায়নি: " +
        error.message
      );

    });

}
      


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   RECENT CHAT
========================= */

function updateRecentChat(user){

  const updates = {};


  updates[
    "recentChats/" +
    currentUser.uid +
    "/" +
    user.uid
  ] = {

    uid:user.uid,

    name:user.name,

    photo:user.photo || "logo.png",

    updatedAt:Date.now()

  };


  updates[
    "recentChats/" +
    user.uid +
    "/" +
    currentUser.uid
  ] = {

    uid:currentUser.uid,

    name:myProfile.name,

    photo:myProfile.photo || "logo.png",

    updatedAt:Date.now()

  };


  database
    .ref()
    .update(updates)

    .then(() => {

      loadRecentChats();

    });

}


/* =========================
   LOAD RECENT CHATS
========================= */

function loadRecentChats(){

  const list =
    document.getElementById("recentList");


  list.innerHTML = "";


  database
    .ref(
      "recentChats/" +
      currentUser.uid
    )
    .orderByChild("updatedAt")
    .once("value")

    .then(snapshot => {

      if(!snapshot.exists()){

        list.innerHTML =
          '<div class="empty">এখনো কোনো Recent Chat নেই</div>';

        return;

      }


      const chats = [];


      snapshot.forEach(child => {

        chats.push(child.val());

      });


      chats.reverse();


      chats.forEach(user => {

        const item =
          document.createElement("div");

        item.className =
          "recentItem";


        const img =
          document.createElement("img");

        img.src =
          user.photo || "logo.png";


        const info =
          document.createElement("div");

        info.className =
          "userInfo";


        const name =
          document.createElement("div");

        name.className =
          "userName";

        name.innerText =
          user.name || "User";


        info.appendChild(name);


        const button =
          document.createElement("button");

        button.className =
          "actionButton chatButton";

        button.innerText =
          "💬 Chat";


        button.onclick =
          () => {

            database
              .ref(
                "users/" +
                user.uid
              )
              .once("value")
              .then(snapshot => {

                if(snapshot.exists()){

                  openChat(
                    snapshot.val()
                  );

                }

              });

          };


        item.appendChild(img);

        item.appendChild(info);

        item.appendChild(button);


        list.appendChild(item);

      });

    });

}


/* =========================
   CLOSE CHAT
========================= */

function closeChat(){

  document.getElementById("chatArea").style.display =
    "none";


  selectedUser = null;

  currentChatId = null;


  if(messageListener){

    messageListener();

    messageListener = null;

  }


  document.getElementById("welcome").style.display =
    "block";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  auth.signOut();

}
