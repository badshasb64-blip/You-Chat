<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You Chat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e5ddd5;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#efeae2;
}

.header{
    background:#075e54;
    color:white;
    padding:14px;
}

.header h2{
    margin:0;
}

.header p{
    margin:4px 0 0;
    font-size:13px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    max-width:75%;
    padding:9px 12px;
    margin-bottom:8px;
    border-radius:8px;
}

.myMessage{
    background:#d9fdd3;
    margin-left:auto;
}

.otherMessage{
    background:white;
    margin-right:auto;
}

.name{
    color:#075e54;
    font-size:12px;
    font-weight:bold;
}

.time{
    text-align:right;
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.bottom{
    display:flex;
    gap:6px;
    padding:8px;
    background:#f0f0f0;
}

#message{
    flex:1;
    border:0;
    outline:0;
    border-radius:25px;
    padding:12px;
    font-size:16px;
}

#send{
    width:48px;
    border:0;
    border-radius:50%;
    background:#128c7e;
    color:white;
    font-size:20px;
}

#login{
    position:fixed;
    inset:0;
    background:#075e54;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}

.loginBox{
    background:white;
    width:90%;
    max-width:360px;
    padding:25px;
    border-radius:15px;
}

.loginBox h1{
    text-align:center;
    color:#075e54;
}

.loginBox input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.loginBox button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#128c7e;
    color:white;
    font-size:16px;
}

#otpBox{
    display:none;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>💬 You Chat</h2>
        <p id="userStatus">Login করুন</p>
    </div>

    <div id="chat"></div>

    <div class="bottom">

        <input
        id="message"
        type="text"
        placeholder="মেসেজ লিখুন..."
        >

        <button id="send">➤</button>

    </div>

</div>


<!-- LOGIN -->

<div id="login">

    <div class="loginBox">

        <h1>💬 You Chat</h1>

        <div id="phoneBox">

            <p>
                আপনার মোবাইল নম্বর দিন
            </p>

            <input
            id="phone"
            type="tel"
            placeholder="+8801XXXXXXXXX"
            >

            <button onclick="sendOTP()">
                OTP পাঠান
            </button>

        </div>


        <div id="otpBox">

            <p>
                আপনার ফোনে আসা OTP লিখুন
            </p>

            <input
            id="otp"
            type="number"
            placeholder="OTP"
            >

            <button onclick="verifyOTP()">
                Verify করুন
            </button>

        </div>

        <div id="recaptcha-container"></div>

    </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey:
    "AIzaSyD_HUTzo6I-X4rpDnoKArfPofSSHNkYeOM",

    authDomain:
    "you-chat-3896c.firebaseapp.com",

    projectId:
    "you-chat-3896c",

    storageBucket:
    "you-chat-3896c.firebasestorage.app",

    messagingSenderId:
    "874787277335",

    appId:
    "1:874787277335:web:f2a71f309a2f32ff60ea52",

    measurementId:
    "G-5S6HK3X836",

    databaseURL:
    "https://you-chat-3896c-default-rtdb.firebaseio.com/"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();

let confirmationResult = null;


/* =========================
   RECAPTCHA
========================= */

window.recaptchaVerifier =
new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",
    {
        size: "normal"
    }
);


/* =========================
   SEND OTP
========================= */

function sendOTP(){

    const phone =
    document.getElementById("phone")
    .value.trim();

    if(phone === ""){

        alert("মোবাইল নম্বর লিখুন");

        return;

    }


    auth.signInWithPhoneNumber(
        phone,
        window.recaptchaVerifier
    )
    .then(function(result){

        confirmationResult = result;

        document.getElementById(
            "phoneBox"
        ).style.display = "none";

        document.getElementById(
            "otpBox"
        ).style.display = "block";

        alert("OTP পাঠানো হয়েছে");

    })
    .catch(function(error){

        alert(
            "OTP পাঠানো যায়নি:\n" +
            error.message
        );

        console.log(error);

    });

}


/* =========================
   VERIFY OTP
========================= */

function verifyOTP(){

    const otp =
    document.getElementById("otp")
    .value.trim();


    if(otp === ""){

        alert("OTP লিখুন");

        return;

    }


    confirmationResult
    .confirm(otp)
    .then(function(result){

        const user =
        result.user;


        document.getElementById(
            "login"
        ).style.display = "none";


        document.getElementById(
            "userStatus"
        ).innerText =
        "🟢 Login সফল";


        loadMessages();

    })
    .catch(function(error){

        alert(
            "OTP ভুল হয়েছে:\n" +
            error.message
        );

    });

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "child_added",
        function(snapshot){

            showMessage(
                snapshot.val()
            );

        }
    );

}


/* =========================
   SEND MESSAGE
========================= */

document
.getElementById("send")
.addEventListener(
    "click",
    sendMessage
);


document
.getElementById("message")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);


function sendMessage(){

    const input =
    document.getElementById(
        "message"
    );


    const text =
    input.value.trim();


    if(text === ""){

        return;

    }


    const user =
    auth.currentUser;


    if(!user){

        alert("আগে Login করুন");

        return;

    }


    database
    .ref("messages")
    .push({

        uid: user.uid,

        phone: user.phoneNumber,

        text: text,

        time:
        new Date().toLocaleTimeString(
            "bn-BD",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ),

        createdAt:
        firebase.database.ServerValue.TIMESTAMP

    });


    input.value = "";

}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(data){

    const chat =
    document.getElementById("chat");


    const div =
    document.createElement("div");


    if(
        auth.currentUser &&
        data.uid === auth.currentUser.uid
    ){

        div.className =
        "message myMessage";

    }else{

        div.className =
        "message otherMessage";

    }


    div.innerHTML =

    '<div class="name">' +
    escapeHTML(
        data.phone || "User"
    ) +
    '</div>' +

    '<div>' +
    escapeHTML(data.text) +
    '</div>' +

    '<div class="time">' +
    escapeHTML(data.time) +
    '</div>';


    chat.appendChild(div);


    chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}

</script>

</body>
</html>
